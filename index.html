        :root {
            --police-red: #ce181e; 
            --police-gold: #ffda44;
            --police-dark: #111827;
            --bg-tech: #f0f2f5;
        }

        body { 
            font-family: 'Lexend', sans-serif; 
            background: #000; 
            margin: 0; padding: 0;
            -webkit-user-select: none; user-select: none;
            overflow: hidden; touch-action: manipulation;
        }

        .app-shell {
            height: 100vh; max-width: 500px; margin: 0 auto;
            background: #fff; display: flex; flex-direction: column;
            position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(255, 218, 68, 0.15);
        }

        /* --- HEADER --- */
        .header-official {
            background: linear-gradient(180deg, #ce181e 0%, #b01419 100%);
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 4px solid var(--police-gold);
            box-shadow: 0 10px 30px rgba(206, 24, 30, 0.4);
            position: relative; z-index: 50;
        }
        .header-official h2 {
            color: var(--police-gold); font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px;
            opacity: 0.95;
        }
        .header-official h1 {
            color: white; font-size: 20px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .header-official p {
            color: var(--police-gold); font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 8px;
        }
        
        .data-btn {
            position: absolute; top: 20px; right: 20px;
            color: var(--police-gold); font-size: 18px; cursor: pointer;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid rgba(255, 218, 68, 0.3);
            transition: all 0.2s; animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(255, 218, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 218, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 218, 68, 0); } }

        /* --- CHAT AREA --- */
        .chat-area { 
            background: #f9fafb; flex: 1; overflow-y: auto; padding: 20px; 
            position: relative;
            background-image: radial-gradient(#ce181e 0.5px, transparent 0.5px);
            background-size: 20px 20px; opacity: 0.98;
        }

        .watermark {
            position: absolute; inset: 0; display: grid;
            grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(8, 1fr);
            pointer-events: none; z-index: 0; opacity: 0.04;
        }
        .watermark-item {
            transform: rotate(-30deg); font-size: 11px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; 
            color: var(--police-red);
        }
        
        .msg { margin-bottom: 20px; display: flex; flex-direction: column; max-width: 88%; position: relative; z-index: 10; animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bubble {
            padding: 14px 18px; font-size: 13.5px; line-height: 1.6;
            border-radius: 12px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            word-wrap: break-word;
        }
        .bot .bubble { 
            background: white; color: #1f2937; border: 1px solid #e5e7eb;
            border-left: 4px solid var(--police-red);
        }
        .user .bubble { 
            background: var(--police-red); color: white; font-weight: 500;
            border-bottom-right-radius: 2px;
        }

        /* --- INPUT --- */
        .input-container {
            padding: 15px; background: white; border-top: 2px solid #f3f4f6;
            display: flex; gap: 10px; align-items: center; z-index: 60;
        }
.input-field {
    flex: 1; 
    background: #f3f4f6; 
    border-radius: 8px;
    padding: 14px 16px; 
    font-size: 14px; 
    border: 1px solid transparent;
    transition: all 0.3s; 
    color: #111; 
    outline: none; 
    font-weight: 500;
    /* ======== LỆNH MỞ KHÓA BÀN PHÍM CHO IPHONE ======== */
    user-select: auto; 
    -webkit-user-select: auto; 
}
        .input-field:focus { background: white; border-color: var(--police-red); box-shadow: 0 0 0 3px rgba(206, 24, 30, 0.1); }

        .send-btn {
            width: 48px; height: 48px; background: var(--police-red); color: var(--police-gold);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            border-radius: 8px; transition: all 0.2s; cursor: pointer; border: none;
        }
        .send-btn:active { transform: scale(0.95); background: #b91c1c; }

        /* --- SUGGESTIONS --- */
        .suggestion-box {
            padding: 12px 20px; background: white; display: flex; gap: 8px; overflow-x: auto;
            border-top: 1px solid #f0f0f0;
        }
        .suggestion-chip {
            border: 1px solid #e5e7eb; color: var(--police-red); background: white;
            padding: 8px 14px; font-size: 11px; font-weight: 700; white-space: nowrap;
            border-radius: 6px; transition: all 0.2s; text-transform: uppercase; cursor: pointer;
        }
        .suggestion-chip:active { background: var(--police-red); color: white; border-color: var(--police-red); }

        /* --- MODAL --- */
        .modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px); z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 15px;
        }
        .modal-content {
            background: white; width: 100%; height: 90%; border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(255,218,68,0.2); border: 1px solid var(--police-gold);
        }
        .modal-header {
            background: var(--police-red); padding: 15px 20px; color: white;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 4px solid var(--police-gold);
        }
        .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; }
        .tab-btn {
            flex: 1; text-align: center; padding: 12px 5px; font-size: 10px;
            font-weight: 800; color: #9ca3af; text-transform: uppercase; cursor: pointer;
            border-bottom: 3px solid transparent; transition: all 0.3s;
        }
        .tab-btn.active { color: var(--police-red); border-bottom-color: var(--police-red); background: #fef2f2; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }

/* ======== CSS HIỆU ỨNG ĐANG GÕ ======== */
.typing-indicator span {
    display: inline-block;
    width: 6px; height: 6px;
    background-color: #ce181e;
    border-radius: 50%; margin: 0 2px;
    animation: bounce 1.4s infinite ease-in-out both;
}
.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}
/* ============================================== */
/* ======== LÀM ĐẸP KHU VỰC NÚT GỢI Ý (SUGGESTIONS UI) ======== */
.suggestions-container {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 10px;
    padding: 12px 16px;
    background: #ffffff;
    border-top: 1px solid #f3f4f6;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch; /* Giúp vuốt mượt trên iPhone */
}

/* Ẩn thanh cuộn ngang để giao diện sạch sẽ */
.suggestions-container::-webkit-scrollbar {
    display: none; 
}

.suggest-btn {
    flex: 0 0 auto; /* Giữ nguyên kích thước nút, không bị ép nhỏ */
    background-color: #fef2f2; /* Nền đỏ cực nhạt sang trọng */
    color: var(--police-red);
    border: 1px solid #fca5a5;
    padding: 8px 16px;
    border-radius: 20px; /* Bo tròn dạng viên thuốc */
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Hiệu ứng khi người dùng chạm (touch) hoặc trỏ chuột vào */
.suggest-btn:active, .suggest-btn:hover {
    background-color: var(--police-red);
    color: #ffffff;
    border-color: var(--police-red);
    transform: scale(0.95); /* Hơi lún xuống tạo cảm giác bấm thật */
}
/* ============================================================ */

       /* ======== 1. DỮ LIỆU CÁC NÚT GỢI Ý ======== */
const SUGGESTIONS = [
    "Khám sức khỏe khi nào?",
    "Tiêu chuẩn chiều cao",
    "Tuyển sinh hệ VB2CA",
    "Quy đổi điểm IELTS",
    "Chỉ tiêu Học viện ANND"
];

/* ======== 2. HÀM VẼ NÚT GỢI Ý (ĐÃ TỐI ƯU) ======== */
function loadSuggestions() {
    // Tìm chính xác khung chứa trong HTML của đồng chí
    const sugContainer = document.getElementById('suggestionBox'); 
    if (!sugContainer) return;

    sugContainer.innerHTML = '';
    sugContainer.className = 'suggestions-container no-scrollbar'; 

    SUGGESTIONS.forEach(text => {
        const btn = document.createElement('button');
        btn.className = 'suggest-btn';
        btn.innerHTML = `<i class="fas fa-bolt text-[#ffda44] drop-shadow-md"></i> ${text}`; 
        
        btn.onclick = () => {
            userInput.value = text;
            handleSend();
        };
        sugContainer.appendChild(btn);
    });
}

/****************************************************************
* 3. LOGIC HỆ THỐNG & KHỞI TẠO APP
****************************************************************/
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');

function initApp() {
    const wm = document.getElementById('watermark');
    for (let i = 0; i < 16; i++) {
        const d = document.createElement('div');
        d.className = 'watermark-item';
        d.innerText = 'PX01 QUẢNG TRỊ';
        wm.appendChild(d);
    }
    
    renderModalData(); // Nạp dữ liệu danh bạ
    loadSuggestions(); // Vẽ dàn nút bấm giao diện xịn
    
    // Lời chào đầu tiên khi bật bot
    addMessage("<b>Tôi là trợ lý ảo tuyển sinh CAND năm 2026, Công an tỉnh Quảng Trị.</b><br>Đồng chí, thí sinh hoặc phụ huynh có thể tra cứu nhanh về <b>đối tượng</b>, <b>điều kiện</b>, <b>thời gian</b>, <b>hồ sơ</b>, <b>lệ phí</b>, <b>VB2CA</b>, <b>trung cấp</b>, <b>sức khỏe</b> và <b>thể lực</b>.", "bot");
}

        function renderModalData() {
            document.getElementById('list-suckhoe').innerHTML = SUC_KHOE_DATA.map(i => `<div class="p-3 bg-white border border-red-100 rounded-lg shadow-sm"><p class="text-xs font-bold text-[#ce181e] uppercase">⚕️ ${i.title}</p><p class="text-[11px] text-gray-700 mt-1 leading-relaxed">${i.content}</p></div>`).join('');
            document.getElementById('list-dieukien').innerHTML = DIEU_KIEN_DATA.map(i => `<div class="p-3 bg-white border border-gray-200 rounded-lg shadow-sm"><p class="text-xs font-bold text-gray-800 uppercase text-[#ce181e]">📌 ${i.title}</p><p class="text-[11px] text-gray-600 mt-1 leading-relaxed">${i.content}</p></div>`).join('');
            filterContact();
        }

        function filterContact() {
            const term = document.getElementById('searchContact').value.toLowerCase();
            const filtered = DANH_BA_DATA.filter(i => 
                i.unit.toLowerCase().includes(term) || 
                i.name.toLowerCase().includes(term)
            );
            
            document.getElementById('list-danhba').innerHTML = filtered.map(i => `
                <div class="p-3 bg-white border border-gray-200 rounded-lg flex justify-between items-center hover:border-red-300 transition-all shadow-sm">
                    <div>
                        <p class="text-[11px] font-bold text-gray-800">${i.unit}</p>
                        <p class="text-[10px] text-gray-500 uppercase font-bold mt-0.5"><i class="fas fa-user-shield mr-1"></i>${i.name}</p>
                    </div>
                    <a href="tel:${i.phone.replace(/[^\d+]/g, '')}" class="text-[11px] font-black text-[#ce181e] bg-red-50 px-2 py-1 rounded border border-red-100 hover:bg-red-600 hover:text-white transition-colors">
                        ${i.phone}
                    </a>
                </div>
            `).join('');
        }

        function addMessage(text, side) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${side}`;
    
    // Logic tự động thêm icon và màu sắc dựa trên nội dung tin nhắn của Bot
    let formattedText = text;
    if (side === 'bot') {
        if (text.includes("Sức khỏe") || text.includes("BMI") || text.includes("thị lực")) {
            formattedText = `<div class="border-l-4 border-blue-500 pl-3"><i class="fas fa-heartbeat text-blue-500 mr-2"></i>${text}</div>`;
        } else if (text.includes("Chỉ tiêu") || text.includes("phương thức")) {
            formattedText = `<div class="border-l-4 border-yellow-500 pl-3"><i class="fas fa-chart-bar text-yellow-500 mr-2"></i>${text}</div>`;
        } else if (text.includes("Lịch") || text.includes("thời gian") || text.includes("2026")) {
            formattedText = `<div class="border-l-4 border-green-500 pl-3"><i class="fas fa-calendar-alt text-green-500 mr-2"></i>${text}</div>`;
        } else if (text.includes("Hồ sơ") || text.includes("Lệ phí")) {
            formattedText = `<div class="border-l-4 border-purple-500 pl-3"><i class="fas fa-file-alt text-purple-500 mr-2"></i>${text}</div>`;
        }
    }

    msgDiv.innerHTML = `<div class="bubble">${formattedText}</div>`;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
}

        // 1. Khởi tạo Engine Tìm kiếm mờ (Fuzzy Search)
const fuse = new Fuse(KNOWLEDGE_BASE, {
    keys: ['keys'],
    includeScore: true,
    threshold: 0.4, 
    ignoreLocation: true,
    minMatchCharLength: 2 // Tránh việc khớp các từ quá ngắn vô nghĩa
});

// 2. Các hàm tạo hiệu ứng Typing UI
function showTypingIndicator() {
    const id = 'typing-' + Date.now();
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg bot`;
    msgDiv.id = id;
    msgDiv.innerHTML = `
        <div class="bubble flex items-center gap-2">
            <div class="typing-indicator flex"><span></span><span></span><span></span></div>
            <span class="text-gray-400 text-[10px] italic">Đang tra cứu dữ liệu...</span>
        </div>`;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    return id;
}

function removeTypingIndicator(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

// 3. Hàm xử lý trung tâm (Bản vá lỗi iOS/Safari & Tối ưu điểm số)
function handleSend() {
    const text = userInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    userInput.value = '';

    const typingId = showTypingIndicator();
    const sendBtn = document.querySelector('.send-btn');
    if (sendBtn) sendBtn.disabled = true;

    setTimeout(() => {
        removeTypingIndicator(typingId);
        if (sendBtn) sendBtn.disabled = false; 
        
        const query = text.toLowerCase();
        const fuseResults = fuse.search(query);

        let finalResults = KNOWLEDGE_BASE.map(item => {
            let score = 0;
            let matchedKeys = [];

            // A. Điểm từ Fuse.js
            const fuseMatch = fuseResults.find(r => r.item === item);
            if (fuseMatch) {
                score += (1 - fuseMatch.score) * 5; 
            }

            // B. Điểm từ Regex (Đã thay thế lookbehind bằng nhóm chụp để tương thích iPhone)
            item.keys.forEach(key => {
                const k = key.toLowerCase();
                const regex = new RegExp(`(^|[^\\p{L}\\p{N}_])(${k})([^\\p{L}\\p{N}_]|$)`, 'iu');
                
                if (regex.test(query)) {
                    score += k.length * 2.5; 
                    matchedKeys.push(k);
                } else if (query.includes(k)) {
                    score += k.length * 0.5; 
                    if (!matchedKeys.includes(k)) matchedKeys.push(k);
                }
            });

            // C. Thưởng điểm nếu khớp nhiều từ khóa
            if (matchedKeys.length > 1) {
                score *= 1.5; 
            }

            return { item, score, matchedKeys };
        });

        // Lọc kết quả: Ngưỡng điểm > 3 để tránh bot trả lời bừa
        let matches = finalResults.filter(r => r.score > 3).sort((a, b) => b.score - a.score);

        if (matches.length > 0) {
            let bestMatch = matches[0].item;
            addMessage(bestMatch.answer, 'bot');
            
            if (matches.length > 1 && matches[1].score >= matches[0].score * 0.6) {
                const related = matches[1].item.answer.split('<br>')[0].replace(/<[^>]*>/g, '');
                const hint = `<i style="font-size:12px; color:#6b7280;"><i class="fas fa-lightbulb text-[#ffda44] mr-1"></i> <b>Có thể bạn quan tâm:</b> ${related}</i>`;
                addMessage(hint, 'bot');
            }
        } else {
            addMessage("Tôi chưa hiểu rõ ý của đồng chí. Đồng chí vui lòng thử dùng các từ khóa ngắn gọn như: <b>đại học</b>, <b>trung cấp</b>, <b>vb2ca</b>, <b>chiều cao</b>, <b>mắt</b>... hoặc tra cứu trực tiếp tại biểu tượng <b><i class='fas fa-database'></i> Trung tâm dữ liệu</b> ở góc trên bên phải.", "bot");
        }
        
    }, 600); 
}

        function ask(q) {
            userInput.value = q;
            handleSend();
        }

        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function switchTab(btn, tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            btn.classList.add('active');
            document.getElementById(tabId).classList.remove('hidden');
        }

        window.onload = initApp;
        /* ======== BƯỚC 2: BẮT SỰ KIỆN PHÍM ENTER ======== */
document.getElementById('userInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault(); // Ngăn chặn việc nhảy dòng
        handleSend(); // Tự động kích hoạt nút gửi
    }
});
