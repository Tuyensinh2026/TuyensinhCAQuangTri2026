        }
        /* --- HEADER --- */
        .header-official {
            background: linear-gradient(180deg, #ce181e 0%, #b01419 100%);
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 4px solid var(--police-gold);
            box-shadow: 0 10px 30px rgba(206, 24, 30, 0.4);
            position: relative; z-index: 50;
        }
        .header-official h2 { color: var(--police-gold); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; opacity: 0.95; }
        .header-official h1 { color: white; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.3; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .header-official p { color: var(--police-gold); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
        
        .data-btn {
            position: absolute; top: 20px; right: 20px;
            color: var(--police-gold); font-size: 18px; cursor: pointer;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid rgba(255, 218, 68, 0.3);
            transition: all 0.2s; animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(255, 218, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 218, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 218, 68, 0); } }
        /* --- CHAT AREA --- */
        .chat-area { 
            background: #f9fafb; flex: 1; overflow-y: auto; padding: 20px; 
            position: relative; scroll-behavior: smooth;
            background-image: radial-gradient(#ce181e 0.5px, transparent 0.5px);
            background-size: 20px 20px; opacity: 0.98;
        }
        .watermark { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(8, 1fr); pointer-events: none; z-index: 0; opacity: 0.04; }
        .watermark-item { transform: rotate(-30deg); font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; color: var(--police-red); }
        
        .msg { margin-bottom: 20px; display: flex; flex-direction: column; max-width: 88%; position: relative; z-index: 10; animation: fadeUp 0.3s ease-out; }
        .msg.bot { align-items: flex-start; }
        .msg.user { align-items: flex-end; margin-left: auto; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .bubble { padding: 14px 18px; font-size: 13.5px; line-height: 1.6; border-radius: 12px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); word-wrap: break-word; }
        .bot .bubble { background: white; color: #1f2937; border: 1px solid #e5e7eb; border-left: 4px solid var(--police-red); border-bottom-left-radius: 2px; }
        .user .bubble { background: var(--police-red); color: white; font-weight: 500; border-bottom-right-radius: 2px; }
        .timestamp { font-size: 10px; color: #9ca3af; margin-top: 4px; padding: 0 4px; }
        
        /* --- INPUT --- */
        .input-container { padding: 15px; background: white; border-top: 2px solid #f3f4f6; display: flex; gap: 10px; align-items: center; z-index: 60; }
        .input-field { flex: 1; background: #f3f4f6; border-radius: 8px; padding: 14px 16px; font-size: 14px; border: 1px solid transparent; transition: all 0.3s; color: #111; outline: none; font-weight: 500; user-select: auto; -webkit-user-select: auto; }
        .input-field:focus { background: white; border-color: var(--police-red); box-shadow: 0 0 0 3px rgba(206, 24, 30, 0.1); }
        .send-btn { width: 48px; height: 48px; background: var(--police-red); color: var(--police-gold); display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 8px; transition: all 0.2s; cursor: pointer; border: none; }
        .send-btn:active { transform: scale(0.95); background: #b91c1c; }
        
        /* --- SUGGESTIONS --- */
        .suggestions-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 10px; padding: 12px 16px; background: #ffffff; border-top: 1px solid #f3f4f6; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .suggestions-container::-webkit-scrollbar { display: none; }
        .suggest-btn { flex: 0 0 auto; background-color: #fef2f2; color: var(--police-red); border: 1px solid #fca5a5; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 6px; }
        .suggest-btn:active, .suggest-btn:hover { background-color: var(--police-red); color: #ffffff; border-color: var(--police-red); transform: scale(0.95); }
        
        /* --- MODAL --- */
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 15px; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.show { opacity: 1; }
        .modal-content { background: white; width: 100%; height: 90%; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(255,218,68,0.2); border: 1px solid var(--police-gold); }
        .modal-header { background: var(--police-red); padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--police-gold); }
        .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 5px; font-size: 10px; font-weight: 800; color: #9ca3af; text-transform: uppercase; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }

            if (side === 'bot' && !text.includes("<i class=")) {

        // Cập nhật hàm chuẩn hóa để xử lý an toàn lỗi "a dơi", "lìa"
        function normalizeQuery(text) {
            let lower = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
            // Loại bỏ các dấu câu cơ bản để từ không bị dính vào nhau (VD: "ngày nào?")
            lower = lower.replace(/[.,!?]/g, ' ');
            
            const stopwords = ['da', 'a', 'cho em hoi', 'cho minh hoi', 'ad oi', 'admin', 'tro ly oi', 'lam sao', 'the nao', 'co duoc khong', 'co bi loai khong', 'tu van', 'cho biet', 'cho hoi'];
            stopwords.forEach(word => {
                // Dùng ranh giới từ (\b) để chỉ xóa những từ đứng độc lập
                lower = lower.replace(new RegExp('\\b' + word + '\\b', 'g'), ' ');
            });
            return lower.replace(/\s+/g, ' ').trim();
        }

        // Kỹ thuật NLP 1: Khai thác Thực thể (Entity Extraction)
        function extractLocation(query) {
            let foundLoc = null;
            const normQuery = normalizeQuery(query);
            // Sắp xếp độ dài từ khóa giảm dần (để "Nam Đông Hà" được ưu tiên quét trước "Đông Hà")
            const sortedLocations = [...LOCATION_KEYWORDS].sort((a, b) => b.length - a.length);
            for (let loc of sortedLocations) {
                const cleanLoc = loc.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/(xa|phuong|thi tran|dac khu)\s+/g, '');
                if (normQuery.includes(cleanLoc)) {
                    foundLoc = loc;
                    break;
                }
            }
            return foundLoc;
        }

        // Kỹ thuật NLP 2: Trả lời tự động dựa trên Thực Thể Địa Danh
        function generateLocationResponse(locationName) {
            const cleanLoc = locationName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/(xa|phuong|thi tran|dac khu)\s+/g, '');
            // Quét DB ẩn để tìm lịch
            let scheduleInfo = "Hệ thống đang cập nhật lịch chi tiết cho địa phương này.";
            for (let item of KNOWLEDGE_BASE) {
                if (item.hidden && item.keys.some(k => k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").includes(cleanLoc))) {
                    scheduleInfo = item.answer;
                    break;
                }
            }

            // Giải mã chuỗi rút gọn trong DB thành câu văn hoàn chỉnh
            let sk = scheduleInfo.match(/SK:\s*(.*?)\./);
            let tl = scheduleInfo.match(/TL:\s*(.*?)\./);
            let vb = scheduleInfo.match(/VB2:\s*(.*?)\./);

            // Xử lý địa chỉ
            let parseAddress = (str) => {
                if(str.includes("BX01")) return "Bệnh xá số 01 (đường Điện Biên Phủ, Nam Đông Hà)";
                if(str.includes("BX02")) return "Bệnh xá số 02 (số 31 Phan Chu Trinh, Đồng Hới)";
                if(str.includes("TTCĐ")) return "TT Văn hóa Điện ảnh tỉnh (đường Trần Phú, Đồng Hới)";
                return str;
            }

            return `
                <div class="mb-2 text-[#ce181e]"><i class="fas fa-map-marker-alt mr-1"></i> <b>Lịch trình khu vực: ${locationName.toUpperCase()}</b></div>
                • <b>Khám Sức khỏe ĐH/TC:</b> ${sk ? parseAddress(sk[1]) : "Đang cập nhật"}. (Sáng 07h30, Chiều 13h30)<br>
                • <b>Khám SK hệ VB2CA:</b> ${vb ? parseAddress(vb[1]) : "Đang cập nhật"}.<br>
                • <b>Kiểm tra Thể lực:</b> ${tl ? parseAddress(tl[1]) : "Đang cập nhật"}.
                <div class="mt-2 text-[11px] text-gray-500 border-t pt-1"><i>Lưu ý: Thí sinh cần có mặt trước 15 phút, khi đi khám nhịn ăn sáng.</i></div>
            `;
        }

        function handleSend() {
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn.disabled) return;
            const rawText = userInput.value.trim();
            if (!rawText) return;
            
            addMessage(rawText, 'user');
            userInput.value = ''; userInput.style.height = '44px';
            
            const typingId = showTyping();
            sendBtn.disabled = true;

            setTimeout(() => {
                document.getElementById(typingId)?.remove();
                sendBtn.disabled = false; 

                // Chuẩn hóa và làm sạch câu hỏi
                const query = normalizeQuery(rawText);
                if (!query) { addMessage("Đồng chí cần tra cứu thông tin gì ạ?", "bot"); return; }

                // Bước 2: Nhận diện thực thể Địa danh (Location NLP)
                let location = extractLocation(rawText);
                if (location && (query.includes('kham') || query.includes('ngay') || query.includes('thoi gian') || query.includes('khi nao') || query.includes('o dau') || query.includes('lich'))) {
                    addMessage(generateLocationResponse(location), 'bot');
                    updateSuggestions(["Tiêu chuẩn chiều cao", "Mắt cận mấy độ được thi?", "Mang theo giấy tờ gì?"]);
                    return;
                }

                // Bước 3: Thuật toán so khớp Điểm số (Scoring Match)
                let finalResults = [];
                const fuseResults = fuse.search(query); 
                KNOWLEDGE_BASE.filter(k => !k.hidden).forEach(item => {
                    let score = 0; let matchCount = 0;
                    
                    // Điểm Fuse (chống sai chính tả)
                    const fuseMatch = fuseResults.find(r => r.item === item);
                    if (fuseMatch) score += (1 - fuseMatch.score) * 5; 

                    // Điểm chứa từ khóa (Keyword match an toàn)
                    item.keys.forEach(k => {
                        let cleanKey = k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
                        try {
                            // Dùng \b để tách từ an toàn trên cả các thiết bị iOS cũ
                            const regex = new RegExp("(^|\\s)(" + cleanKey + ")(\\s|$)", "i");
                            if (regex.test(query)) {
                                score += k.length * 3; matchCount++;
                            } else if (query.includes(cleanKey)) {
                                score += k.length * 1; matchCount++;
                            }
                        } catch(e) {
                            if (query.includes(cleanKey)) { score += k.length * 1; matchCount++; }
                        }
                    });

                    if (matchCount > 1) score *= 1.5; // Combo multiplier
                    if (score > 3) finalResults.push({ item, score });
                });

                finalResults.sort((a, b) => b.score - a.score);

                // Bước 4: Đưa ra quyết định
                if (finalResults.length > 0) {
                    let bestMatch = finalResults[0].item;
                    addMessage(bestMatch.answer, 'bot');
                    updateSuggestions(bestMatch.follows); // Đổi nút bấm theo ngữ cảnh
                } else {
                    addMessage("Xin lỗi đồng chí, tôi chưa hiểu rõ ý này. Đồng chí có thể thử hỏi ngắn gọn hơn (VD: <b>'Xã Lìa khám khi nào'</b>, <b>'Chiều cao'</b>, <b>'IELTS'</b>) hoặc tra cứu trực tiếp tại <b><i class='fas fa-database text-yellow-600'></i> Dữ liệu gốc</b> góc phải trên cùng.", "bot");
                    updateSuggestions(INITIAL_SUGGESTIONS);
                }
            }, 700);
        }

        // ==========================================
        // 4. KHỞI TẠO APP
        // ==========================================
        window.onload = () => {
            const wm = document.getElementById('watermark');
            for (let i = 0; i < 16; i++) {
                const d = document.createElement('div'); d.className = 'watermark-item'; d.innerText = 'PX01 QUẢNG TRỊ'; wm.appendChild(d);
            }
            updateSuggestions(INITIAL_SUGGESTIONS);
            
            // Generate Data for Modal
            document.getElementById('list-suckhoe').innerHTML = SUC_KHOE_DATA.map(i => `<div class="p-3 bg-white border border-red-100 rounded-xl mb-2 shadow-sm hover:shadow-md transition"><p class="text-xs font-bold text-[#ce181e] uppercase">⚕️ ${i.title}</p><p class="text-[12px] text-gray-700 mt-1.5 leading-relaxed">${i.content}</p></div>`).join('');
            document.getElementById('list-dieukien').innerHTML = DIEU_KIEN_DATA.map(i => `<div class="p-3 bg-white border border-gray-200 rounded-xl mb-2 shadow-sm hover:shadow-md transition"><p class="text-xs font-bold text-[#ce181e] uppercase">📌 ${i.title}</p><p class="text-[12px] text-gray-600 mt-1.5 leading-relaxed">${i.content}</p></div>`).join('');
            filterContact();

            setTimeout(() => {
                addMessage("<b>Xin chào! Tôi là trợ lý hỗ trợ tư vấn tuyển sinh Công an tỉnh Quảng Trị năm 2026.</b><br>Tôi có thể giúp đồng chí, thí sinh, phụ huynh tra cứu:<br>• <b>Lịch khám</b> (Theo từng Xã/Phường)<br>• <b>Tiêu chuẩn sức khỏe</b> (Chiều cao, Mắt...)<br>• <b>Chỉ tiêu</b> (Từng trường, hệ đào tạo)<br><br>Đồng chí cần hỏi thông tin gì ạ?", "bot");
            }, 400);
        };

        function filterContact() {
            const term = normalizeQuery(document.getElementById('searchContact')?.value || "");
            const filtered = DANH_BA_DATA.filter(i => {
                let cleanUnit = i.unit.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
                let cleanName = i.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
                return cleanUnit.includes(term) || cleanName.includes(term);
            });
            document.getElementById('list-danhba').innerHTML = filtered.map(i => `
                <div class="p-3 bg-white border border-gray-100 rounded-xl flex justify-between items-center mb-2 shadow-sm">
                    <div>
                        <p class="text-[11px] font-bold text-gray-800">${i.unit}</p>
                        <p class="text-[10px] text-gray-500 uppercase font-bold mt-1"><i class="fas fa-user-shield mr-1 text-gray-400"></i> ${i.name}</p>
                    </div>
                    <a href="tel:${i.phone.replace(/\D/g,'')}" class="text-[11px] font-black text-[#ce181e] bg-red-50 px-3 py-1.5 rounded-lg border border-red-100"><i class="fas fa-phone"></i> Gọi</a>
                </div>
            `).join('');
        }
    </script>
